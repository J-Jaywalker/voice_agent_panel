[project]
name = "panel-core"
version = "0.1.0"
description = "Pure conversation-floor logic. No I/O, no clock reads, no network."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_core"]
