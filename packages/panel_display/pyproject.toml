[project]
name = "panel-display"
version = "0.1.0"
description = "The 12m x 4.5m video wall. One aiohttp app, no build step."
requires-python = ">=3.12"
dependencies = [
    "panel-core",
    # Static files and the WebSocket on one port, so the venue machine gets
    # one URL. Already present via livekit-agents; pinned here because this
    # package uses it directly and a transitive dependency is not a contract.
    "aiohttp>=3.9",
]

[project.scripts]
panel-display = "panel_display.demo:main"

[tool.uv.sources]
panel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Includes `static/` — the page, its CSS, the vendored Radix scales and the
# self-hosted font all ship inside the package. There is no bundler and no
# npm anywhere in this repo, and the venue machine must not need one.
packages = ["src/panel_display"]
