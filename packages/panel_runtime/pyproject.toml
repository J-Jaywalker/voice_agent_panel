[project]
name = "panel-runtime"
version = "0.1.0"
description = "I/O adapters: STT, VAD, TTS, audio mixer. Everything panel_core refuses to do."
requires-python = ">=3.12"
dependencies = [
    "panel-core",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    # Raw WS for TTS (cancellation semantics are the point, so we own them) and
    # for Speechmatics Agent STT, which has no SDK during preview.
    "websockets>=13.0",
    # LiveKit as a library (VAD, TTS plugins) — not as a framework. ADR 0001.
    # panel_core does not depend on panel_runtime, so core work never pays for this.
    "livekit-agents>=1.7.1",
    "livekit-plugins-silero>=1.7.1",
    "anthropic>=1.2",
    "rich>=13.7",
]

[project.scripts]
panel = "panel_runtime.panel:main"
barge-in = "panel_runtime.live_bargein:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_runtime"]
