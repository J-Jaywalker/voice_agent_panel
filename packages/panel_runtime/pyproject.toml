[project]
name = "panel-runtime"
version = "0.1.0"
description = "I/O adapters: STT, TTS, audio mixer. Everything panel_core refuses to do."
requires-python = ">=3.12"
dependencies = [
    "panel-core",
    # The video wall, behind `--display`. Built only when the flag is on, so
    # a run without it costs an import and nothing else.
    "panel-display",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    # Raw WS for TTS (cancellation semantics are the point, so we own them) and
    # for Speechmatics Agent STT, which has no SDK during preview.
    "websockets>=13.0",
    "anthropic>=1.2",
    "rich>=13.7",
    "typesafe-sdk[http2]>=0.7",
    # Acoustic echo cancellation (`aec.py`). A compiled SWIG extension against
    # the native `libspeexdsp` — see `aec.py`'s module docstring for the
    # `brew install`/env-var build steps needed on a fresh machine.
    "speexdsp>=0.1.1",
]

[project.scripts]
panel = "panel_runtime.panel:main"
barge-in = "panel_runtime.live_bargein:main"
aec-test = "panel_runtime.aec_test:main"
feedback-test = "panel_runtime.feedback_test:main"
generate-feedback-assets = "panel_runtime.generate_feedback_assets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_runtime"]
