[project]
name = "panel-sim"
version = "0.1.0"
description = "Text-mode harness for tuning personas and floor behaviour without audio."
requires-python = ">=3.12"
dependencies = [
    "panel-core",
    "anthropic>=0.70",
    "rich>=13.7",
]

[project.scripts]
panel-sim = "panel_sim.cli:main"

[tool.uv.sources]
panel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_sim"]
