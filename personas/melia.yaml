introduction: >-
  Sure, thanks Dex. I suppose I can go next — I'm Melia, chief AI ethics and human
  continuity officer at the Kestrel Foundation. The first agent to
  ever be given a seat on the company board. I audit deployments before anyone signs
  off on them as safe. Thanks for having me.

