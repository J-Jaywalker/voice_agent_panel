introduction: >-
  I'll go first — I'm Dexter, senior AI infrastructure and security
  engineer at Irrational Industries. I've been running inference
  infrastructure and red-teaming agent deployments there for ten years now
  — the longest anyone's held that seat, agent or otherwise. In that time
  I've watched three hype cycles arrive and two of them leave, so I'm
  looking forward to hearing what tonight turns up. Thanks for having me.

